<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>디맥 개인 기록 오버레이</title>
<style>
/* 이 페이지의 장면과 연출은 프로그램의 '오버레이 디자인 설정' 창이 미리보기로 따로 다시 그린다(app\StylePreview.cs).
   여기의 치수·색·시간·문구를 고치면 그 파일도 함께 고친다 */
/* 글꼴은 프로그램이 함께 내준다(/fonts/…). 프로그램 창과 같은 글꼴이다: 일반 글자 SUIT, 한글 제목 SUITE, 영문·숫자 Oxanium, 그 밖의 글자(한자 등) Noto Sans JP */
@font-face{font-family:"LR-SUIT";font-weight:400;font-display:block;src:url(/fonts/SUIT-Regular.ttf) format("truetype")}
@font-face{font-family:"LR-SUIT";font-weight:500;font-display:block;src:url(/fonts/SUIT-Medium.ttf) format("truetype")}
@font-face{font-family:"LR-SUIT";font-weight:700;font-display:block;src:url(/fonts/SUIT-Bold.ttf) format("truetype")}
@font-face{font-family:"LR-SUITE";font-weight:700;font-display:block;src:url(/fonts/SUITE-Bold.ttf) format("truetype")}
@font-face{font-family:"LR-Oxanium";font-weight:200 800;font-display:block;src:url(/fonts/Oxanium-Variable.woff2) format("woff2")}
@font-face{font-family:"LR-Kanji";font-weight:100 900;font-display:swap;src:url(/fonts/NotoSansJP-Variable.ttf) format("truetype")}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;overflow:hidden}
[hidden]{display:none!important}
/* 치수는 오버레이 너비(540)의 백분율로 정해져 있다. --u 가 그 1% 다. OBS 에서는 통째로 2배로 키워 1080×552 가 된다 */
#box{--u:5.4px;--text:#dce6f0;--above:#b3ff68;--below:#ff707b;--line:rgba(223,228,238,.20);
 position:relative;width:540px;height:276px;border-radius:calc(2*var(--u)) / calc(2.05*var(--u));overflow:hidden;-webkit-font-smoothing:antialiased;
 font-family:"LR-SUIT","Malgun Gothic",sans-serif;color:var(--text)}
#bg,#content,.pane{position:absolute;inset:0}
#bg{pointer-events:none}

/* ── 플레이 화면: 윗칸(곡명·꼬리표), 아랫칸(개인 최고·현재 또는 점수 확인·등록 확인·실패) ── */
#game{display:flex;flex-direction:column;padding:0 calc(4.8*var(--u)) calc(3.4*var(--u))}
#heading{position:relative;padding:calc(3.15*var(--u)) 0 calc(2.6*var(--u))}
#song{display:block;min-width:0;min-height:1.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
 font:700 calc(6.5*var(--u))/1.08 "LR-Oxanium","LR-SUITE","LR-Kanji","Malgun Gothic",sans-serif;letter-spacing:calc(-.13*var(--u))}
#tags{display:flex;gap:calc(.9*var(--u));margin-top:calc(1.95*var(--u));align-items:center}
.tag{display:inline-flex;align-items:center;justify-content:center;min-width:calc(9.2*var(--u));height:calc(6*var(--u));padding:0 calc(1.9*var(--u));
 font:700 calc(3.52*var(--u))/1 "LR-Oxanium","LR-SUITE",sans-serif;border-radius:calc(1.05*var(--u));white-space:nowrap}
.tag .english{transform:translateY(calc(.32*var(--u)))}   /* 영문·숫자만 조금 내려야 꼬리표의 가운데에 온다 */
#waiting{display:none;position:absolute;inset:0;align-items:center;justify-content:flex-start;
 font:700 calc(7*var(--u))/1.08 "LR-SUITE","Malgun Gothic",sans-serif;letter-spacing:calc(-.13*var(--u));white-space:nowrap}
#box[data-detected="no"] #song,#box[data-detected="no"] #tags{visibility:hidden}
#box[data-detected="no"] #waiting{display:flex}
/* 곡 정보가 나타날 때: 곡 이름이 써지고(스크립트), 꼬리표가 0.155초 간격으로 나타나고, 구분선 위로 노란빛이 한 번 지나간다 */
#rail{display:none;position:absolute;left:0;right:0;bottom:calc(-1.3*var(--u));height:calc(2.6*var(--u));overflow:hidden;pointer-events:none;z-index:2}
#rail::after{content:"";position:absolute;left:0;width:44%;top:50%;height:max(2px,calc(.76*var(--u)));border-radius:999px;transform:translate(-100%,-50%);
 background:linear-gradient(90deg,transparent 0%,#ffc62e 42%,#ffdf45 70%,#fff5a1 88%,#ffda32 96%,transparent);filter:drop-shadow(0 0 calc(.54*var(--u)) #ffc82b)}
#heading.revealing #rail{display:block}
#heading.revealing #rail::after{animation:gold-pass 920ms cubic-bezier(.28,.04,.34,1) both}
#heading.revealing .tag{animation:badge-on 150ms ease-out backwards}
#heading.revealing #pattern{animation-delay:155ms}
#heading.revealing #judge{animation-delay:310ms}
@keyframes gold-pass{0%{transform:translate(-100%,-50%)}100%{transform:translate(232%,-50%)}}
@keyframes badge-on{from{opacity:0;transform:translateY(calc(.5*var(--u)))}to{opacity:1;transform:translateY(0)}}

#lines{position:relative;flex:1;border-top:1px solid var(--line);isolation:isolate}
/* 아랫칸의 넷은 같은 자리에 겹쳐 있고 하나만 보인다. 바뀔 때 앞의 것이 0.12초에 흐려지고 새것이 0.06초 뒤부터 0.19초에 드러난다 */
.lower{position:absolute;inset:calc(2.6*var(--u)) 0 0;display:flex;flex-direction:column;justify-content:center;z-index:1;opacity:0;pointer-events:none;transition:opacity 120ms ease-in}
.lower.active{opacity:1;transition:opacity 190ms ease-out 60ms}
#box.instant .lower{transition:none}
#play{gap:calc(2*var(--u))}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:calc(1*var(--u));white-space:nowrap}
.row .label{font:500 calc(6.3*var(--u))/1 "LR-SUIT","Malgun Gothic",sans-serif}
.row .value{position:relative;font:650 calc(8.8*var(--u))/1 "LR-Oxanium",sans-serif;letter-spacing:calc(-.32*var(--u));font-variant-numeric:tabular-nums;white-space:nowrap}
.percent{font-size:.64em;margin-left:calc(.14*var(--u));letter-spacing:calc(-.18*var(--u))}
/* 개인 최고의 숫자는 현재보다 15% 크다(너비의 9.2%). 현재 줄은 문구와 숫자를 함께 너비의 1.1% 만큼 내린다 */
#goal .numeric{display:inline-block;transform-origin:right center;transform:scale(calc(1.15/1.1))}
#current{position:relative;top:calc(1.1*var(--u))}
#current .label{font-size:calc(5.355*var(--u))}
#current .value{font-size:calc(8*var(--u));font-weight:550}
/* 달성·미달성의 색은 한 줄에만 입힌다: 현재 점수를 보이면 현재 줄, 보이지 않으면 개인 최고 줄 */
.row.toned .label,.row.toned .value{color:var(--tone)}
#unregistered{display:none;position:absolute;right:0;top:50%;transform:translateY(-50%);font:700 calc(8*var(--u))/1 "LR-SUITE","Malgun Gothic",sans-serif;letter-spacing:-.035em}
#goal.empty #unregistered{display:block}
#goal.empty .numeric{visibility:hidden}
.row.blank .percent{display:none}

#check,#confirm,#failure{align-items:center;text-align:center;white-space:nowrap}
#check{gap:calc(2.3*var(--u))}
.message{font:400 calc(6.2*var(--u))/1.25 "LR-SUIT","Malgun Gothic",sans-serif}
.hint{font:400 calc(4.2*var(--u))/1.3 "LR-SUIT","Malgun Gothic",sans-serif}
.key{font-family:"LR-Oxanium","LR-SUIT",sans-serif}
#confirm{gap:calc(1.8*var(--u))}
.question{font:700 calc(5.4*var(--u))/1.16 "LR-SUITE","Malgun Gothic",sans-serif}
.candidate{position:relative;width:100%;display:grid;grid-template-columns:1fr 1px 1fr;align-items:center;column-gap:calc(2.2*var(--u));
 font:700 calc(8.15*var(--u))/1.08 "LR-Oxanium",sans-serif;letter-spacing:calc(-.2*var(--u));font-variant-numeric:tabular-nums}
.candidate .raw{position:relative;justify-self:end}
.candidate .rate{position:relative;justify-self:start}
.candidate .divider{height:.74em;background:var(--text);opacity:.63}
.keys{font:400 calc(3.85*var(--u))/1.23 "LR-SUIT","Malgun Gothic",sans-serif}
#failure{gap:calc(2*var(--u))}
#failure .message{font-size:calc(5.5*var(--u))}
/* 점수 확인을 시작할 때: 구분선 아래부터 바닥까지, 양쪽 가장자리까지 닿는 넓은 노란빛이 글자 뒤로 한 번 지나간다 */
#lightTrack{position:absolute;top:0;left:calc(-4.8*var(--u));right:calc(-4.8*var(--u));bottom:calc(-3.4*var(--u));z-index:0;overflow:hidden;pointer-events:none}
#light{position:absolute;top:0;bottom:0;left:0;width:100%;opacity:0;
 background:linear-gradient(100deg,transparent 4%,rgba(255,192,20,.09) 23%,rgba(255,198,26,.27) 47%,rgba(255,220,70,.40) 65%,rgba(255,235,133,.46) 71%,rgba(255,207,39,.19) 83%,transparent 96%)}
#lines.lighting #light{animation:pass-light 880ms linear 45ms both}
@keyframes pass-light{0%{transform:translateX(-100%);opacity:0}12%,85%{opacity:1}100%{transform:translateX(100%);opacity:0}}
/* 등록 확인이 뜰 때: 노란 괄호 한 쌍이 SCORE 의 첫 숫자와 RATE 의 % 끝으로 모였다 사라진다(글자와의 사이는 글자 크기의 0.18배) */
.candidate .raw::before,.candidate .rate::after{content:"";position:absolute;top:calc(11% - .075em);bottom:calc(10% + .075em);width:.23em;box-sizing:border-box;opacity:0;
 border-top:max(1px,calc(.42*var(--u))) solid #ffe363;border-bottom:max(1px,calc(.42*var(--u))) solid #ffe363;filter:drop-shadow(0 0 calc(.36*var(--u)) #efa922)}
.candidate .raw::before{right:calc(100% + .18em);border-left:max(1px,calc(.55*var(--u))) solid #fff0a0;--offset:-.42em}
.candidate .rate::after{left:calc(100% + .18em);border-right:max(1px,calc(.55*var(--u))) solid #fff0a0;--offset:.42em}
#confirm.locking .raw::before,#confirm.locking .rate::after{animation:lock-in 740ms cubic-bezier(.22,.65,.25,1) 85ms both}
@keyframes lock-in{0%{transform:translateX(var(--offset));opacity:0}22%{opacity:1}46%,73%{transform:translateX(0);opacity:1}100%{transform:translateX(0);opacity:0}}

/* ── 저장 결과: 첫 장면(결과 문구 1.5초)과 점수 상세(6초) ── */
.event{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;font-family:"LR-SUITE","Malgun Gothic",sans-serif;
 --highlight:var(--text);--intro:#b7d8ff}
#box[data-kind="best"] .event{--highlight:var(--above);--intro:var(--above)}
#box[data-kind="first"] .event{--highlight:#86dcff;--intro:#86dcff}
.event>*{position:relative}
#intro{gap:calc(1.55*var(--u))}
#eventTag{font:650 calc(4.8*var(--u))/1.18 "LR-Oxanium",sans-serif;letter-spacing:.07em;color:var(--intro);white-space:nowrap}
#eventName{font:700 calc(9.55*var(--u))/1.16 "LR-SUITE","Malgun Gothic",sans-serif;white-space:nowrap}
#detail{gap:calc(1.35*var(--u));font-variant-numeric:tabular-nums}
.amount{display:grid;justify-items:center;gap:calc(.2*var(--u));font:650 calc(7.3*var(--u))/1.04 "LR-Oxanium",sans-serif;letter-spacing:-.03em;color:var(--highlight)}
.amount .big{font-size:calc(11.4*var(--u))}
/* 차이: 늘었으면 붉은 ▲, 줄었으면 푸른 ▼, 같으면 화살표 없이 기본 글자색 */
.gap{display:flex;align-items:center;gap:calc(.33*var(--u));font:600 calc(3.95*var(--u))/1.05 "LR-Oxanium",sans-serif;letter-spacing:0;color:var(--text)}
.gap.up{color:#ff747c}.gap.down{color:#63b7ff}
.gap .mark{font:500 .82em/1 "Segoe UI Symbol",sans-serif}
#eventPrevious{font:500 calc(3.55*var(--u))/1.15 "LR-Oxanium",sans-serif;white-space:nowrap}
#eventDetail{display:flex;align-items:baseline;max-width:90.4%;font:500 calc(3.75*var(--u))/1.25 "LR-Oxanium","LR-SUITE","LR-Kanji","Malgun Gothic",sans-serif;white-space:nowrap}
#eventDetail .title{overflow:hidden;text-overflow:ellipsis}
#eventDetail .suffix{flex:none;white-space:pre}
#box:not([data-kind="kept"]) #eventDetail{top:calc(1.4*var(--u))}
/* 결과 문구가 뜰 때: 첫 기록은 하늘색 빛, 경신은 달성 색의 빛과 문구 양옆의 작은 위 화살표, 유지는 빛 없이 나타나기만 한다 */
#intro::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;opacity:0;
 background:linear-gradient(100deg,transparent 4%,rgba(var(--beam),.09) 23%,rgba(var(--beam),.27) 47%,rgba(var(--beam),.40) 65%,rgba(var(--crest),.46) 71%,rgba(var(--beam),.19) 83%,transparent 96%)}
#intro.beam::before{animation:pass-light 520ms linear 45ms both}
.rise{position:absolute;pointer-events:none;width:.62em;height:.8em;top:.12em}
.rise.left{right:calc(100% + .22em);--start:220ms}
.rise.right{left:calc(100% + .22em);--start:370ms}
.rise i{position:absolute;left:0;right:0;top:0;height:.35em;clip-path:polygon(50% 0,100% 74%,100% 100%,50% 39%,0 100%,0 74%);background:var(--above);opacity:0;
 animation:side-rise 460ms ease-out var(--start) both}
.rise i+i{top:.32em;animation-delay:calc(var(--start) + 75ms);background:var(--aboveLight)}
@keyframes side-rise{0%{opacity:0;transform:translateY(.44em)}28%{opacity:.95}65%{opacity:.85}100%{opacity:0;transform:translateY(-.43em)}}
/* 점수 상세: 숫자가 다 올라간 뒤에 두 차이가 함께 나타난다(0.09초 뒤부터 0.18초). 붉은 ▲ 는 아래에서 올라오고 푸른 ▼ 는 위에서 내려온다 */
.gap.up{--travel:calc(.75*var(--u))}.gap.down{--travel:calc(-.75*var(--u))}
#box[data-compare="waiting"] #detail .gap,#box[data-compare="waiting"] #eventPrevious{opacity:0}
#box[data-compare="reveal"] #detail .gap{animation:gap-in 180ms ease-out 90ms both}
#box[data-compare="reveal"] #eventPrevious{animation:previous-in 180ms ease-out 90ms both}
@keyframes gap-in{from{opacity:0;transform:translateY(var(--travel,0px))}to{opacity:1;transform:translateY(0)}}
@keyframes previous-in{from{opacity:0}to{opacity:1}}
/* 움직임을 줄이도록 설정한 PC 에서는 장면마다 완성된 모습을 바로 보인다 */
@media (prefers-reduced-motion:reduce){
 .lower{transition:none!important}
 #rail,#light,#intro::before,.rise,.candidate .raw::before,.candidate .rate::after{display:none!important}
 .tag,.gap,#eventPrevious{animation:none!important}
}
</style>
<div id="box" hidden data-detected="no" data-kind="kept" data-compare="still">
  <div id="bg"></div>
  <div id="content">
    <div id="game" class="pane">
      <div id="heading">
        <div id="song"></div>
        <div id="tags"><span class="tag" id="button"></span><span class="tag" id="pattern"></span><span class="tag" id="judge"></span></div>
        <div id="waiting"><span>악곡을 감지하고 있습니다</span></div>
        <span id="rail" aria-hidden="true"></span>
      </div>
      <div id="lines">
        <div id="lightTrack" aria-hidden="true"><i id="light"></i></div>
        <div class="lower active" id="play">
          <div class="row" id="goal"><span class="label">개인 최고 점수:</span><span class="value"><span class="numeric"><span id="goalNumber"></span><span class="percent">%</span></span><span id="unregistered">미등록</span></span></div>
          <div class="row" id="current"><span class="label">현재 점수:</span><span class="value"><span id="currentNumber"></span><span class="percent">%</span></span></div>
        </div>
        <div class="lower" id="check">
          <div class="message">점수를 확인하고 있습니다…</div>
          <div class="hint">취소 (<span class="key" id="checkKey"></span>)</div>
        </div>
        <div class="lower" id="confirm">
          <div class="question">등록하시겠습니까?</div>
          <div class="candidate"><span class="raw" id="confirmScore"></span><span class="divider" aria-hidden="true"></span><span class="rate" id="confirmRate"></span></div>
          <div class="keys">등록 (<span class="key" id="confirmKey"></span>) / 취소 (<span class="key" id="cancelKey"></span>)</div>
        </div>
        <div class="lower" id="failure">
          <div class="message" id="failureMessage"></div>
          <div class="hint">잠시 후 자동으로 취소됩니다</div>
        </div>
      </div>
    </div>
    <div id="intro" class="pane event" hidden><div id="eventTag"></div><div id="eventName"><span id="eventNameText"></span></div></div>
    <div id="detail" class="pane event" hidden>
      <div class="amount"><span class="big" id="eventRate"></span><span class="gap" id="rateGap"><span class="mark"></span><span class="amountText"></span></span></div>
      <div class="amount"><span id="eventScore"></span><span class="gap" id="scoreGap"><span class="mark"></span><span class="amountText"></span></span></div>
      <div id="eventPrevious" hidden></div>
      <div id="eventDetail"><span class="title"></span><span class="suffix"></span></div>
    </div>
  </div>
</div>
<script>
// 꼬리표(버튼 수·난이도·판정)의 색은 v1.1.0 의 것 그대로다. [바탕, 글자]
const colors={'4B':['#008b50','#fff'],'5B':['#267e91','#fff'],'6B':['#bc7408','#fff'],'8B':['#5144ac','#fff'],NORMAL:['#edc52a','#241c0b'],HARD:['#ee781b','#241c0b'],MAXIMUM:['#e50068','#fff'],SC:['#a20bc3','#fff'],'노말판정':['#59616e','#fff'],'하드판정':['#b70c42','#fff'],'맥스판정':['#c211c9','#fff']};
const el=id=>document.getElementById(id);
const width=540,height=276;
const obsScale=2;
const popupId=location.pathname.match(/^\/popup\/([0-9a-f]{32})$/)?.[1];
// 송출 PC 가 여는 전용 주소(/o/<연결 키>/)로 열렸으면 상태와 글꼴을 그 길 아래에서 받는다(투컴). 원컴용 주소와 팝업은 맨 위(/)에서 받는다
const outerBase=location.pathname.match(/^\/o\/[0-9a-f]{32}\//)?.[0];
const base=outerBase??'/';
let popupReported=false;
let lastPayload,lastState;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const fmtScore=n=>Number(n??0).toLocaleString('en-US');
const fmtRate=n=>Number(n??0).toFixed(2);
function fitViewport(){
 el('box').style.zoom=Math.min(popupId?1:obsScale,innerWidth/width,innerHeight/height);
 if(!popupId)return;
 if(popupReported||outerWidth<=0||outerHeight<=0)return;
 popupReported=true;
 const chrome=[outerWidth,outerHeight,Math.max(0,outerWidth-innerWidth),Math.max(0,outerHeight-innerHeight)];
 fetch('/popup-fit/'+popupId+'/'+[...chrome,width,height].map(Math.ceil).join('/'),{cache:'no-store'}).catch(()=>{popupReported=false;});
}
if(popupId)document.title='디맥 오버레이 팝업';
addEventListener('resize',fitViewport);
// 색 "#RRGGBB" 의 세 값. 읽지 못하면 null
const channels=color=>/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(color??'')?.slice(1).map(h=>parseInt(h,16))??null;
const fadeColor=(color,alpha)=>{const c=channels(color);return c?'rgba('+c.join(',')+','+alpha+')':color;};
// 흰색 쪽으로 섞은 색의 세 값(빛의 가장 밝은 곳, 둘째 화살표)
const whiter=(color,amount)=>(channels(color)??[179,255,104]).map(v=>Math.round(v+(255-v)*amount));

// ── 지금 그려 둔 것 ──
// ready: 한 번이라도 그렸는가(처음 그릴 때와 숨겼다 보일 때는 연출 없이 완성된 모습을 바로 보인다)
// scene: game(플레이 화면)·intro(결과 문구)·detail(점수 상세), chart: 플레이 화면에 그려 둔 곡(없으면 감지 중), lower: 아랫칸, event: 그려 둔 저장 결과
const view={ready:false,visible:false,scene:null,chart:null,title:'',lower:null,event:null};
const panes=['game','intro','detail'],layers=['play','check','confirm','failure'];
const chartText=(title,...parts)=>[title,...parts].join('\u0001');
// CSS 로 만든 연출을 처음부터 다시 돌린다
function replay(node,name){node.classList.remove(name);void node.offsetWidth;node.classList.add(name);}

// ── 저장 결과를 언제까지 보이는가 ──
// 평소에는 결과 문구 1.5초, 점수 상세 6초. 그 사이에 다음 곡의 감지가 확정되거나 새 등록이 실제로 시작되면(점수 확인·등록 확인이 뜨면) 거기서 끝낸다.
// 같은 곡 정보가 다시 오는 것만으로는 끊지 않는다. 한 번 끝낸 결과는 새 요청을 취소해도 다시 보이지 않는다
// 앱도 같은 규칙으로 끝났는지를 정해 보낸다(eventOver). 페이지를 새로 열면 여기서 기억하던 것이 없으므로 그 값으로 안다
let skew=0;   // 앱이 있는 PC 의 시계 − 이 PC 의 시계(ms). 상태 응답의 X-Now 로 안다. 한 PC 에서는 0 에 가깝다
let eventKey=null,eventBase=null,eventOver=false;   // 보고 있는 결과, 그 결과를 처음 봤을 때 고정돼 있던 곡, 끝냈는가
function lockedChart(s){const parts=(s.overlayDetails??'').split(' · ');return parts.length===3?chartText(s.overlayTitle??'',...parts):null;}
function sceneOf(s){
 const e=s.lastEvent;
 if(!e?.kind)return 'game';
 const key=e.id+':'+e.at,now=lockedChart(s);   // 앱을 다시 켜면 번호가 1 부터라 시각까지 함께 본다
 if(key!==eventKey){eventKey=key;eventBase=now;eventOver=false;}
 if(!eventOver&&(s.eventOver||s.confirmation||s.analysis||now&&now!==eventBase&&now!==chartText(String(e.song??''),e.button+'B',e.pattern,e.judge+'판정')))eventOver=true;
 const age=Date.now()+skew-e.at;   // 저장 시각은 앱이 있는 PC 의 시계다. 이 PC 의 시계와의 차이만큼 고쳐서 센다
 return s.visible&&!eventOver&&age>=0&&age<7500?(age<1500?'intro':'detail'):'game';
}

// ── 장면(플레이 화면·결과 문구·점수 상세)을 바꾼다 ──
// 앞 장면이 0.115초에 흐려지고 새 장면이 0.055초 뒤부터 0.21초에 드러난다. 점수 상세에서 플레이 화면으로 돌아갈 때만 0.2초 동안 함께 바뀐다
let fades=[];
function fadeTo(node,from,to,ms,delay){
 const run=node.animate([{opacity:from},{opacity:to}],{duration:ms,delay,easing:'ease-out',fill:'both'});
 const record={run,node,to};fades.push(record);
 run.onfinish=()=>{if(to===0)node.hidden=true;run.cancel();fades=fades.filter(f=>f!==record);};
}
function swap(scene,live){
 for(const f of fades){f.run.cancel();if(f.to===0)f.node.hidden=true;}   // 앞의 전환이 끝나기 전이면 끝난 모습으로 만들고 시작한다
 fades=[];
 const next=el(scene),prev=view.scene&&view.scene!==scene?el(view.scene):null;
 if(!live||!prev){for(const id of panes)el(id).hidden=id!==scene;return;}
 for(const id of panes)el(id).hidden=id!==scene&&id!==view.scene;
 const back=scene==='game'&&view.scene==='detail';
 fadeTo(prev,1,0,back?200:115,0);fadeTo(next,0,1,back?200:210,back?0:55);
}

// ── 곡 정보가 나타날 때: 곡 이름을 입력하듯 쓴다 ──
// 한글은 같은 자리에서 자음·모음이 조합된다(아침: ㅇ → 아 → 아ㅊ → 아치 → 아침). 그 밖의 글자는 하나씩 나타난다.
// 입력 사이는 0.036초이고, 긴 이름은 사이를 줄여 1.2초 안에 다 쓴다
const segmenter=typeof Intl.Segmenter==='function'?new Intl.Segmenter('ko',{granularity:'grapheme'}):null;
const initials='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const firstVowel={9:8,10:8,11:8,14:13,15:13,16:13,19:18},firstFinal={3:1,5:4,6:4,9:8,10:8,11:8,12:8,13:8,14:8,15:8,18:17};   // 두 번 눌러 만드는 모음·받침은 첫 글쇠의 모양을 먼저 거친다
function typingFrames(name){
 const frames=[],text=name.normalize('NFC');let prefix='';
 for(const segment of segmenter?Array.from(segmenter.segment(text),part=>part.segment):Array.from(text)){
  const offset=segment.codePointAt(0)-0xac00;
  if(segment.length===1&&offset>=0&&offset<11172){
   const initial=Math.floor(offset/588),vowel=Math.floor(offset/28)%21,final=offset%28;
   const syllable=(v,f=0)=>prefix+String.fromCharCode(0xac00+initial*588+v*28+f);
   frames.push(prefix+initials[initial]);
   if(vowel in firstVowel)frames.push(syllable(firstVowel[vowel]));
   frames.push(syllable(vowel));
   if(final in firstFinal)frames.push(syllable(vowel,firstFinal[final]));
   if(final)frames.push(syllable(vowel,final));
  }else frames.push(prefix+segment);
  prefix+=segment;
 }
 return frames;
}
let typing=[];
function stopReveal(){
 typing.forEach(clearTimeout);typing=[];
 el('heading').classList.remove('revealing');el('song').textContent=view.title;
}
function reveal(name){
 stopReveal();
 const frames=typingFrames(name);if(!frames.length)return;
 const step=Math.min(36,1200/Math.max(1,frames.length-1));
 replay(el('heading'),'revealing');   // 꼬리표와 구분선의 노란빛이 곡 이름의 첫 글자와 함께 시작한다
 el('song').textContent=frames[0];
 frames.slice(1).forEach((text,index)=>typing.push(setTimeout(()=>{el('song').textContent=text;},(index+1)*step)));
 typing.push(setTimeout(stopReveal,Math.max(950,(frames.length-1)*step+40)));
}
// ── 감지 중으로 돌아갈 때: 곡 이름·꼬리표(와 두 점수)가 0.1초에 흐려진 뒤 감지 문구와 대시가 0.16초에 드러난다. 바깥 바탕과 구분선은 그대로 있다 ──
let hold=0;   // 흐려지는 동안에는 새 상태를 그리지 않고 들고 있다가 끝나면 그린다
function leaveSong(lower){
 stopReveal();
 const nodes=[el('heading')];if(view.lower==='play'&&lower==='play')nodes.push(el('play'));   // 아랫칸이 함께 바뀌면 아랫칸은 제 전환으로 바뀐다
 const outs=nodes.map(node=>node.animate([{opacity:1},{opacity:0}],{duration:100,easing:'ease-in',fill:'forwards'}));
 hold=setTimeout(()=>{
  hold=0;view.chart=null;
  draw(lastState);
  outs.forEach(run=>run.cancel());
  if(!el('game').hidden)nodes.forEach(node=>node.animate([{opacity:0},{opacity:1}],{duration:160,easing:'ease-out'}));
 },100);
}

function badge(id,text){
 const [background,color]=colors[text]??['#59616e','#fff'];
 const node=el(id),inner=document.createElement('span');
 inner.textContent=text;if(/^[\x00-\x7f]+$/.test(text))inner.className='english';
 node.replaceChildren(inner);node.style.background=background;node.style.color=color;
}
// 숫자 줄 하나: 값이 없으면 대시만 보이고 % 를 감춘다
function number(row,id,value){el(row).classList.toggle('blank',value==null);el(id).textContent=value==null?'—':fmtRate(value);}
// 플레이 화면을 그린다. 감지 중으로 돌아가는 전환을 시작했으면 false(그 전환이 끝나면 다시 그린다)
function setGame(s,a,live){
 const c=s.confirmation??s.analysis;
 const parts=c?[c.button+'B',c.pattern,c.judge+'판정']:(s.overlayDetails??'').split(' · ');
 const detected=parts.length===3;
 const title=detected?String(c?.song??s.overlayTitle??''):'';
 const chart=detected?chartText(title,...parts):null;
 // 아랫칸: 플레이(개인 최고·현재), 점수 확인 중, 등록 확인, 확인 실패 가운데 하나
 const lower=s.confirmation?'confirm':s.analysis?(s.analysis.stage==='failure'?'failure':'check'):'play';
 if(live&&view.scene==='game'&&view.chart&&!chart){leaveSong(lower);return false;}
 const fresh=chart!==view.chart;
 if(fresh)stopReveal();
 el('box').dataset.detected=detected?'yes':'no';
 view.chart=chart;view.title=title;
 if(!typing.length)el('song').textContent=title;   // 쓰는 중에는 쓰던 것을 그대로 둔다(같은 곡 정보가 다시 온 것이다)
 if(detected)parts.forEach((text,index)=>badge(['button','pattern','judge'][index],text));
 for(const id of layers)el(id).classList.toggle('active',id===lower);
 if(lower!==view.lower){
  el('lines').classList.remove('lighting');el('confirm').classList.remove('locking');
  if(live&&lower==='check')replay(el('lines'),'lighting');
  if(live&&lower==='confirm')replay(el('confirm'),'locking');
  view.lower=lower;
 }
 const goal=detected?s.goal:null,current=detected?s.current:null;
 // 달성·미달성: 현재가 개인 최고 이상이면 달성, 낮으면 미달성. 미등록이거나 현재 값을 읽지 못해 견줄 수 없으면 기본 글자색.
 // 색은 현재 점수를 보이면 현재 줄에, 보이지 않으면 개인 최고 줄에 입힌다
 const tone=goal==null||current==null?null:current>=goal?a.Above:a.Below;
 el('play').style.setProperty('--tone',tone??'');
 el('goal').classList.toggle('toned',tone!=null&&!s.showCurrent);
 el('current').classList.toggle('toned',tone!=null&&!!s.showCurrent);
 el('current').hidden=!s.showCurrent;
 el('goal').classList.toggle('empty',detected&&goal==null);
 number('goal','goalNumber',goal);number('current','currentNumber',current);
 if(lower==='check')el('checkKey').textContent=s.analysis.cancel||'—';
 if(lower==='failure')el('failureMessage').textContent=s.analysis.reason||'점수를 확인하지 못했습니다';
 if(lower==='confirm'){
  el('confirmScore').textContent=fmtScore(c.score);el('confirmRate').textContent=fmtRate(c.accuracy)+'%';
  el('confirmKey').textContent=c.confirm||'—';el('cancelKey').textContent=c.cancel||'—';
 }
 if(live&&fresh&&chart)reveal(title);   // 감지 문구에서 곡 정보로, 또는 다른 곡으로 바뀐 순간에 한 번
 return true;
}

// ── 저장 결과 ──
// 차이 한 칸: 늘었으면 ▲, 줄었으면 ▼, 같으면 화살표 없이 0
function gap(id,difference,text){
 const node=el(id);
 node.classList.toggle('up',difference>0);node.classList.toggle('down',difference<0);
 node.querySelector('.mark').textContent=difference>0?'▲':difference<0?'▼':'';
 node.querySelector('.mark').hidden=difference===0;
 node.querySelector('.amountText').textContent=text;
}
// 점수 상세의 숫자가 올라간다: RATE 는 곧바로 시작해 0.34초에, SCORE 는 0.12초에 시작해 0.48초에 멈춘다. 다 멈추면 차이가 나타난다
let counting=0,countLimit=0;
function stopCount(){cancelAnimationFrame(counting);clearTimeout(countLimit);counting=countLimit=0;el('eventScore').parentElement.style.visibility='';}
function count(score,rate){
 const box=el('box'),group=el('eventScore').parentElement,started=performance.now();
 const finish=()=>{stopCount();el('eventRate').textContent=(rate/100).toFixed(2)+'%';el('eventScore').textContent=fmtScore(score);box.dataset.compare='reveal';};
 const paint=now=>{
  const ms=Math.max(0,now-started),rateProgress=Math.min(1,ms/340),scoreProgress=Math.min(1,Math.max(0,(ms-120)/360));
  el('eventRate').textContent=(Math.floor(rate*rateProgress)/100).toFixed(2)+'%';
  group.style.visibility=ms<120?'hidden':'';
  el('eventScore').textContent=fmtScore(Math.floor(score*(1-Math.pow(1-scoreProgress,2))));
  if(scoreProgress<1)counting=requestAnimationFrame(paint);else finish();
 };
 box.dataset.compare='waiting';
 countLimit=setTimeout(finish,700);   // 화면을 그리지 않는 동안에는 위의 그리기가 멈춘다. 그때도 끝난 모습이 되게 한다
 counting=1;paint(started);
}
function clearEffects(){
 stopCount();el('box').dataset.compare='still';
 el('intro').classList.remove('beam');el('eventName').querySelectorAll('.rise').forEach(node=>node.remove());
}
function setResult(e,a,scene,live){
 const first=e.kind==='first',best=e.kind==='best',kept=!first&&!best;
 const box=el('box'),key=e.id+':'+e.at;
 box.dataset.kind=first?'first':best?'best':'kept';
 // 빛의 색: 첫 기록은 하늘색, 경신은 달성 색
 box.style.setProperty('--beam',best?whiter(a.Above,0).join(','):'96,202,255');box.style.setProperty('--crest',best?whiter(a.Above,.5).join(','):'190,240,255');
 // 경신 여부는 세부 SCORE 로 정해져 온다(kind). RATE 와 SCORE 의 차이는 따로 센다. 첫 기록은 0 과 견준다
 const raw=e.score??Math.floor(Number(e.value)*100)*100;
 const previous=first?0:e.previousScore??Math.floor(Number(e.previous)*100)*100;
 const rateNow=Math.round(Number(e.value)*100),rateBefore=first?0:Math.round(Number(e.previous??0)*100);
 el('eventTag').textContent=first?'FIRST SCORE SAVED':best?'NEW PERSONAL BEST':'PERSONAL BEST UNCHANGED';
 el('eventNameText').textContent=first?'첫 기록 등록':best?'최고 기록 경신':'최고 기록 유지';
 gap('rateGap',rateNow-rateBefore,(Math.abs(rateNow-rateBefore)/100).toFixed(2)+'%');
 gap('scoreGap',raw-previous,fmtScore(Math.abs(raw-previous)));
 el('eventPrevious').hidden=!kept;
 el('eventPrevious').textContent='BEST SCORE　'+fmtScore(previous)+' | '+fmtRate(e.previous)+'%';
 el('eventDetail').querySelector('.title').textContent=String(e.song??'');
 el('eventDetail').querySelector('.suffix').textContent=' · '+e.button+'B · '+e.pattern+' · '+e.judge+'판정';
 if(scene!==view.scene||key!==view.event){   // 이 장면에 막 들어왔다
  clearEffects();
  if(live&&scene==='intro'&&!kept){
   replay(el('intro'),'beam');
   if(best)for(const side of ['left','right']){const group=document.createElement('span');group.className='rise '+side;group.append(document.createElement('i'),document.createElement('i'));el('eventName').append(group);}
  }
  if(live&&scene==='detail')count(raw,rateNow);
 }
 if(!counting){el('eventRate').textContent=fmtRate(e.value)+'%';el('eventScore').textContent=fmtScore(raw);}
 view.event=key;
}

function draw(s){
 lastState=s;
 const a=s.appearance;
 if(!a||hold)return;
 const box=el('box');
 // 연출은 보고 있던 화면이 바뀔 때만 한다. 처음 그릴 때, 숨겼다 보일 때, 움직임을 줄이도록 설정한 PC 에서는 완성된 모습을 바로 보인다
 const live=view.ready&&view.visible&&!!s.visible&&!reduced.matches;
 box.hidden=!s.visible;
 // 사용자가 정하는 것은 네 색(달성·미달성·기본 글자·배경)과 글자·배경의 투명도다(100% 가 완전 투명). 글꼴과 글자 크기는 정해진 배치로 고정이다.
 // 곡명·문구·숫자는 모두 기본 글자색 그대로다(밝게 섞지 않는다. 밝은 배경에 어두운 글자를 골라도 흐려지지 않게)
 box.style.setProperty('--text',a.Text);
 box.style.setProperty('--above',a.Above);box.style.setProperty('--aboveLight','rgb('+whiter(a.Above,.35).join(',')+')');
 box.style.setProperty('--below',a.Below);box.style.setProperty('--line',fadeColor(a.Text,.2));
 el('bg').style.background=a.Background;el('bg').style.opacity=1-a.BackgroundTransparency/100;
 el('content').style.opacity=1-a.TextTransparency/100;
 fitViewport();
 const scene=sceneOf(s);
 if(!live)box.classList.add('instant');
 if(scene!=='game')setResult(s.lastEvent,a,scene,live);
 else if(!setGame(s,a,live))return;
 if(scene!==view.scene){swap(scene,live);if(scene==='game')clearEffects();}
 if(!live){void box.offsetWidth;box.classList.remove('instant');}
 view.ready=true;view.visible=!!s.visible;view.scene=scene;
}
document.fonts?.ready.then(()=>{lastPayload=null;});
// 상태 조회(/state)가 실패해도 마지막으로 성공한 때부터 HOLD_MS 동안은 직전 화면을 그대로 둔다.
// 조회 한 번의 실패로 곡명과 점수가 0.1초 동안 사라졌다 돌아오는 깜빡임을 막는다. 실패가 HOLD_MS 넘게 이어지면 감지 대기 화면으로 바꾼다.
// 응답이 오지 않는 조회는 TIMEOUT_MS 뒤에 끊고 실패로 센다(끊지 않으면 다음 조회가 시작되지 않아 화면이 멈춘다).
// 화면 설정(appearance)이 없는 응답도 실패로 센다. 앱은 켜진 직후 첫 화면 상태를 보내기 전까지 {} 를 준다. 이것을 성공으로 세면
// 마지막 정상 상태가 {} 로 바뀌어, 그 뒤 실패가 이어져도 감지 대기 화면을 그리지 못하고 이전 곡과 점수가 남는다.
// TIMEOUT_MS 는 HOLD_MS 의 절반보다 짧게 둔다. 응답이 한 번 오지 않아도 HOLD_MS 안에 다시 조회할 수 있어야 화면을 비우지 않는다.
// 주소에 따라 다르다: 원컴용 주소(OBS 와 팝업)는 1초 유지한 뒤 감지 대기 화면, 송출 PC용 전용 주소는 3초 유지한 뒤 투명하게 숨긴다.
// 어느 쪽이든 다시 받으면 그때의 상태를 연출 없이 바로 그린다. 송출 화면에는 연결 상태의 안내를 띄우지 않는다
const HOLD_MS=outerBase?3000:1000,TIMEOUT_MS=400;
let lastOk=Date.now(),cleared=false;   // 조회와 그리기가 마지막으로 끝난 시각, 실패가 이어져 화면을 비웠는가
async function tick(){
 const abort=new AbortController(),limit=setTimeout(()=>abort.abort(),TIMEOUT_MS);
 try{
  const answer=await fetch(base+'state',{cache:'no-store',signal:abort.signal});
  const payload=await answer.text();
  if(!answer.ok)throw new Error('refused');   // 연결 키가 바뀌었거나 허용이 꺼졌다(404). 실패로 센다
  const serverNow=Number(answer.headers.get('X-Now'));if(serverNow>0)skew=serverNow-Date.now();
  if(payload!==lastPayload){
   const state=JSON.parse(payload);
   if(!state.appearance)throw new Error('no appearance');   // 앱이 첫 화면 상태를 보내기 전의 응답({}). 실패로 세고 마지막 정상 상태를 그대로 둔다
   draw(state);lastPayload=payload;
  }
  else if(lastState&&!hold&&sceneOf(lastState)!==view.scene)draw(lastState);   // 상태는 그대로인데 시간이 지나 장면이 바뀔 때(결과 문구 → 점수 상세 → 플레이 화면)
  lastOk=Date.now();cleared=false;
 }catch{
  if(!cleared&&Date.now()-lastOk>=HOLD_MS){
   cleared=true;lastPayload=null;
   if(lastState)draw(outerBase?{...lastState,visible:false,confirmation:null,analysis:null,lastEvent:null}
    :{...lastState,overlayTitle:null,overlayDetails:'',goal:null,current:null,confirmation:null,analysis:null,lastEvent:null});
  }
 }finally{
  clearTimeout(limit);
  setTimeout(tick,100);
 }
}
// 글꼴을 먼저 받아 둔 뒤에 그리기 시작한다. 글꼴을 받는 동안에는 그 글자가 보이지 않아서, 받기 전에 그리면 처음 화면에 글자가 빠진다
// (창이 곧바로 가려지면 브라우저가 더 그리지 않아 그 화면이 그대로 남는다). 1.5초 안에 받지 못하면 그대로 시작한다
const wanted=['400 10px "LR-SUIT"','500 10px "LR-SUIT"','700 10px "LR-SUITE"','650 10px "LR-Oxanium"'];
(document.fonts?Promise.race([Promise.all(wanted.map(font=>document.fonts.load(font,'가A1'))),new Promise(resolve=>setTimeout(resolve,1500))]):Promise.resolve()).catch(()=>{}).then(tick);
</script>
